<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Guides - Tourist Guide</title>
    <link rel="stylesheet" href="styles-new.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-map-marked-alt"></i>
                <span>TouristGuide</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="destinations.html" class="nav-link">Destinations</a></li>
                <li><a href="guides.html" class="nav-link">Guides</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="admin.html" class="nav-link admin-link"><i class="fas fa-shield-alt"></i> Admin</a></li>
            </ul>
            <div class="auth-buttons">
                <button onclick="userManager.showLogin()" class="btn-login">Login</button>
                <button onclick="userManager.showRegister()" class="btn-register">Register</button>
            </div>
        </div>
    </nav>

    <section class="guides" style="padding-top: 100px;">
        <div class="container">
            <div class="section-header">
                <h2>Expert Tour Guides</h2>
                <p>Connect with local experts who know their destinations inside out</p>
            </div>
            <div id="selected-destination-banner" style="display:none; margin: 0 0 20px 0; padding: 12px 16px; background: #eef6ff; border: 1px solid #cfe2ff; border-radius: 10px; color: #1d4e89; font-weight: 600;"></div>

            <div id="guides-list" class="guide-cards">
                <!-- Guides will be loaded here -->
            </div>

            <div class="text-center" style="margin-top: 40px;">
                <button onclick="userManager.showRegister()" class="btn-primary">
                    <i class="fas fa-user-plus"></i> Become a Guide
                </button>
            </div>
        </div>
    </section>

    <script src="remote-sync.js?v=4"></script>
    <script src="user-manager.js"></script>
    <script src="logo-global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            refreshAuthUI();
            updateLogoOnPage();
            loadGuides();
        });

        function getSelectedDestinationContext() {
            const params = new URLSearchParams(window.location.search);
            const fromQuery = (params.get('destination') || '').trim();
            const fromStorage = (localStorage.getItem('selectedDestinationForGuideBooking') || '').trim();
            return fromQuery || fromStorage || '';
        }

        function refreshAuthUI() {
            if (typeof userManager === 'undefined') return;
            userManager.currentUser = userManager.getCurrentUser();
            if (userManager.currentUser) {
                userManager.updateUIForLoggedInUser();
            } else {
                userManager.updateUIForLoggedOutUser();
            }
        }

        function updateLogoOnPage() {
            const savedLogo = localStorage.getItem('siteLogo');
            const savedName = localStorage.getItem('siteName');
            
            if (savedLogo) {
                const logoIcon = document.querySelector('.logo i');
                if (logoIcon) {
                    const img = document.createElement('img');
                    img.src = savedLogo;
                    img.style.width = '40px';
                    img.style.height = '40px';
                    img.style.objectFit = 'contain';
                    img.style.marginRight = '0.5rem';
                    logoIcon.parentNode.replaceChild(img, logoIcon);
                }
            }
            
            if (savedName) {
                const nameElement = document.querySelector('.logo span');
                if (nameElement) nameElement.textContent = savedName;
            }
        }

        function loadGuides() {
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            const allGuides = allUsers.filter(user => user.role === 'guide');
            const selectedDestination = getSelectedDestinationContext();
            const destinationNeedle = selectedDestination.toLowerCase();
            const filteredGuides = selectedDestination
                ? allGuides.filter(guide => {
                    const locationText = String(guide.destination || guide.location || '').toLowerCase();
                    const expertiseText = String(guide.expertise || '').toLowerCase();
                    return locationText.includes(destinationNeedle) || expertiseText.includes(destinationNeedle);
                })
                : allGuides;
            const container = document.getElementById('guides-list');
            const banner = document.getElementById('selected-destination-banner');

            if (banner) {
                if (selectedDestination) {
                    banner.style.display = 'block';
                    banner.textContent = `Booking destination: ${selectedDestination}`;
                } else {
                    banner.style.display = 'none';
                    banner.textContent = '';
                }
            }

            if (allGuides.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #666;">
                        <i class="fas fa-user-friends" style="font-size: 4rem; color: #ddd; margin-bottom: 20px;"></i>
                        <h3>No guides registered yet</h3>
                        <p>Be the first to register as a tour guide!</p>
                        <button onclick="userManager.showRegister()" class="btn-primary" style="margin-top: 20px;">
                            Register as Guide
                        </button>
                    </div>
                `;
                return;
            }

            const noMatchHtml = (selectedDestination && filteredGuides.length === 0)
                ? `
                    <div style="text-align: center; padding: 30px 20px; color: #666;">
                        <i class="fas fa-search" style="font-size: 2rem; color: #aaa; margin-bottom: 10px;"></i>
                        <h3 style="margin-bottom: 6px;">No exact guide match found for "${selectedDestination}"</h3>
                        <p>Showing all available guides instead.</p>
                    </div>
                `
                : '';

            const guidesToRender = (selectedDestination && filteredGuides.length === 0 ? allGuides : filteredGuides);
            container.innerHTML = noMatchHtml + guidesToRender.map(guide => `
                <div class="guide-card enhanced">
                    <div class="guide-header">
                        <div class="guide-photo-container">
                            <img src="${guide.photo || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face'}" alt="${guide.name}" class="guide-photo">
                            <div class="guide-status online"></div>
                        </div>
                        <div class="guide-info">
                            <h3>${guide.name}</h3>
                            <p class="guide-location">
                                <i class="fas fa-map-marker-alt"></i> ${guide.destination || guide.location || 'India'}
                            </p>
                            <div class="guide-stats">
                                <span class="guide-rating">
                                    <i class="fas fa-star"></i> ${guide.rating || '4.5'}
                                </span>
                                <span class="guide-experience">${guide.experience || '5'}+ years</span>
                            </div>
                        </div>
                    </div>
                    <p class="guide-bio">${guide.bio || 'Professional tour guide with local expertise'}</p>
                    <div class="guide-specialties">
                        <span class="specialty-tag">${guide.expertise || 'General Tours'}</span>
                    </div>
                    <div class="guide-footer">
                        <div class="guide-rate">
                            <i class="fas fa-rupee-sign"></i>${guide.rate || '100'}/hr
                        </div>
                        <button class="book-guide-btn" onclick="bookGuide('${guide.id}')">
                            <i class="fas fa-calendar-check"></i> Book Now
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function bookGuide(guideId) {
            if (!userManager.currentUser) {
                userManager.showLogin();
                return;
            }
            
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            const guide = allUsers.find(u => u.id == guideId);
            if (!guide) return;
            
            const modal = document.createElement('div');
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="closeModal(this)">&times;</span>
                    <h2>Book ${guide.name}</h2>
                    <form onsubmit="submitGuideBooking(event, '${guide.id}')">
                        <div class="form-group">
                            <label>Tour Date</label>
                            <input type="date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label>Duration (hours)</label>
                            <input type="number" name="hours" min="1" max="12" value="4" required>
                        </div>
                        <div class="form-group">
                            <label>Group Size</label>
                            <input type="number" name="people" min="1" max="15" value="2" required>
                        </div>
                        <div class="form-group">
                            <label>Tour Type</label>
                            <select name="tourType" required>
                                <option value="cultural">Cultural Tour</option>
                                <option value="food">Food Tour</option>
                                <option value="historical">Historical Tour</option>
                                <option value="custom">Custom Tour</option>
                            </select>
                        </div>
                        <div class="price-summary">
                            <h3>Total: ₹${(guide.rate || 100) * 4}</h3>
                        </div>
                        <button type="submit" class="btn-primary">Book Guide</button>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function submitGuideBooking(event, guideId) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            const guide = allUsers.find(u => u.id == guideId);
            if (!guide || !userManager.currentUser) return;
            const selectedDestination = getSelectedDestinationContext();
            
            const booking = {
                id: Date.now(),
                type: 'guide',
                guide: guide.name,
                guideId: guideId,
                destination: selectedDestination || guide.destination || guide.location || '',
                customerName: userManager.currentUser.name,
                customerId: userManager.currentUser.id,
                customerEmail: userManager.currentUser.email,
                customerPhone: userManager.currentUser.phone,
                date: formData.get('date'),
                hours: formData.get('hours'),
                people: formData.get('people'),
                tourType: formData.get('tourType'),
                amount: (guide.rate || 100) * parseInt(formData.get('hours')),
                status: 'confirmed',
                bookingDate: new Date().toISOString()
            };
            
            userManager.currentUser.bookings = userManager.currentUser.bookings || [];
            userManager.currentUser.bookings.push(booking);
            localStorage.setItem('currentUser', JSON.stringify(userManager.currentUser));

            const customerIndex = allUsers.findIndex(u => String(u.id) === String(userManager.currentUser.id));
            if (customerIndex !== -1) {
                allUsers[customerIndex].bookings = allUsers[customerIndex].bookings || [];
                allUsers[customerIndex].bookings.push(booking);
            }
            
            // Add booking notification to guide
            const guideIndex = allUsers.findIndex(u => u.id == guideId);
            if (guideIndex !== -1) {
                allUsers[guideIndex].bookings = allUsers[guideIndex].bookings || [];
                allUsers[guideIndex].bookings.push(booking);
                
                allUsers[guideIndex].notifications = allUsers[guideIndex].notifications || [];
                allUsers[guideIndex].notifications.push({
                    id: Date.now(),
                    type: 'booking',
                    title: 'New Booking Received!',
                    message: `${userManager.currentUser.name} has booked you for ${formData.get('hours')} hours on ${formData.get('date')}`,
                    bookingId: booking.id,
                    read: false,
                    date: new Date().toISOString()
                });

                const bookingMessage = {
                    id: Date.now() + 1,
                    from: userManager.currentUser.id,
                    fromName: userManager.currentUser.name,
                    to: guideId,
                    toName: guide.name,
                    subject: `New booking #${booking.id} from ${userManager.currentUser.name}`,
                    message: `${userManager.currentUser.name} booked you for ${formData.get('hours')} hour(s) on ${formData.get('date')} for ${formData.get('people')} people (${formData.get('tourType')} tour).`,
                    bookingId: booking.id,
                    date: new Date().toISOString(),
                    read: false
                };
                allUsers[guideIndex].messages = allUsers[guideIndex].messages || [];
                allUsers[guideIndex].messages.push(bookingMessage);
                userManager.currentUser.sentMessages = userManager.currentUser.sentMessages || [];
                userManager.currentUser.sentMessages.push(bookingMessage);
                if (customerIndex !== -1) {
                    allUsers[customerIndex].sentMessages = allUsers[customerIndex].sentMessages || [];
                    allUsers[customerIndex].sentMessages.push(bookingMessage);
                }
                
                localStorage.setItem('allUsers', JSON.stringify(allUsers));
            }
            
            closeModal(event.target);
            showNotification(`Guide ${guide.name} booked successfully!`, 'success');
            setTimeout(() => {
                if (confirm('Would you like to send a message to your guide?')) {
                    showMessagingModal(guideId, booking.id);
                }
            }, 300);
        }

        function showMessagingModal(guideId, bookingId) {
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            const guide = allUsers.find(u => u.id == guideId);
            if (!guide) return;

            const modal = document.createElement('div');
            modal.className = 'modal-backdrop';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close" onclick="closeModal(this)">&times;</span>
                    <h2><i class="fas fa-comments"></i> Message ${guide.name}</h2>
                    <form onsubmit="sendMessageToGuide(event, '${guideId}', '${bookingId}')">
                        <div class="form-group">
                            <label>Subject</label>
                            <input type="text" name="subject" value="Regarding booking #${bookingId}" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="message" rows="4" placeholder="Hi ${guide.name}, I have booked you for a tour. Looking forward to it!" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function sendMessageToGuide(event, guideId, bookingId) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
            const guideIndex = allUsers.findIndex(u => u.id == guideId);
            if (guideIndex === -1 || !userManager.currentUser) return;

            const message = {
                id: Date.now(),
                from: userManager.currentUser.id,
                fromName: userManager.currentUser.name,
                to: guideId,
                toName: allUsers[guideIndex].name,
                subject: formData.get('subject'),
                message: formData.get('message'),
                bookingId: bookingId,
                date: new Date().toISOString(),
                read: false
            };

            allUsers[guideIndex].messages = allUsers[guideIndex].messages || [];
            allUsers[guideIndex].messages.push(message);
            allUsers[guideIndex].notifications = allUsers[guideIndex].notifications || [];
            allUsers[guideIndex].notifications.push({
                id: Date.now() + 1,
                type: 'message',
                title: 'New Message',
                message: `${userManager.currentUser.name} sent you a message about booking #${bookingId}.`,
                bookingId: bookingId,
                read: false,
                date: new Date().toISOString()
            });

            userManager.currentUser.sentMessages = userManager.currentUser.sentMessages || [];
            userManager.currentUser.sentMessages.push(message);
            const customerIndex = allUsers.findIndex(u => String(u.id) === String(userManager.currentUser.id));
            if (customerIndex !== -1) {
                allUsers[customerIndex].sentMessages = allUsers[customerIndex].sentMessages || [];
                allUsers[customerIndex].sentMessages.push(message);
            }

            localStorage.setItem('allUsers', JSON.stringify(allUsers));
            localStorage.setItem('currentUser', JSON.stringify(userManager.currentUser));
            closeModal(event.target);
            showNotification('Message sent to guide successfully!', 'success');
        }

        function closeModal(element) {
            const modal = element.closest('.modal-backdrop');
            if (modal) modal.remove();
        }
    </script>
</body>
</html>
