<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tourist Guide</title>
    <link rel="stylesheet" href="styles-new.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-map-marked-alt"></i>
                <span>TouristGuide</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="destinations.html" class="nav-link">Destinations</a></li>
                <li><a href="guides.html" class="nav-link">Guides</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="admin.html" class="nav-link admin-link"><i class="fas fa-shield-alt"></i> Admin</a></li>
            </ul>
            <div class="auth-buttons">
                <button onclick="userManager.showLogin()" class="btn-login">Login</button>
                <button onclick="userManager.showRegister()" class="btn-register">Register</button>
            </div>
        </div>
    </nav>

    <section style="padding: 120px 0 80px; background: #f8f9fa;">
        <div class="container">
            <div class="section-header">
                <h2>Contact Us</h2>
                <p>Get in touch with us for any questions or support</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1000px; margin: 0 auto;">
                <!-- Contact Form -->
                <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
                    <h3 style="margin-bottom: 20px; color: #333;">Send us a Message</h3>
                    <form onsubmit="submitContactForm(event)">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Subject</label>
                            <select name="subject" required>
                                <option value="">Select Subject</option>
                                <option value="booking">Booking Inquiry</option>
                                <option value="guide">Guide Registration</option>
                                <option value="support">Technical Support</option>
                                <option value="feedback">Feedback</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea name="message" rows="5" required placeholder="Tell us how we can help you..."></textarea>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </form>
                </div>

                <!-- Contact Info -->
                <div>
                    <div style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px;">
                        <h3 style="margin-bottom: 20px; color: #333;">Get in Touch</h3>
                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="width: 50px; height: 50px; background: #667eea; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-envelope" style="color: white; font-size: 20px;"></i>
                                </div>
                                <div>
                                    <h4 style="margin: 0; color: #333;">Email</h4>
                                    <p id="contact-email-display" style="margin: 5px 0 0 0; color: #666;">info@touristguide.com</p>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="width: 50px; height: 50px; background: #667eea; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-phone" style="color: white; font-size: 20px;"></i>
                                </div>
                                <div>
                                    <h4 style="margin: 0; color: #333;">Phone</h4>
                                    <p id="contact-phone-display" style="margin: 5px 0 0 0; color: #666;">+91 9876543210</p>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <div style="width: 50px; height: 50px; background: #667eea; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-map-marker-alt" style="color: white; font-size: 20px;"></i>
                                </div>
                                <div>
                                    <h4 style="margin: 0; color: #333;">Address</h4>
                                    <p id="contact-address-display" style="margin: 5px 0 0 0; color: #666;">New Delhi, India</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
                        <h3 style="margin-bottom: 20px; color: #333;">Follow Us</h3>
                        <div style="display: flex; gap: 15px;">
                            <a href="#" style="width: 50px; height: 50px; background: #3b5998; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                <i class="fab fa-facebook-f" style="color: white; font-size: 20px;"></i>
                            </a>
                            <a href="#" style="width: 50px; height: 50px; background: #1da1f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                <i class="fab fa-twitter" style="color: white; font-size: 20px;"></i>
                            </a>
                            <a href="#" style="width: 50px; height: 50px; background: #e4405f; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                <i class="fab fa-instagram" style="color: white; font-size: 20px;"></i>
                            </a>
                            <a href="#" style="width: 50px; height: 50px; background: #ff0000; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                                <i class="fab fa-youtube" style="color: white; font-size: 20px;"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="remote-sync.js?v=6"></script>
    <script src="user-manager.js"></script>
    <script src="logo-global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            refreshAuthUI();
            updateLogoOnPage();
            updateContactInfoOnPage();
        });

        function refreshAuthUI() {
            if (typeof userManager === 'undefined') return;
            userManager.currentUser = userManager.getCurrentUser();
            if (userManager.currentUser) {
                userManager.updateUIForLoggedInUser();
            } else {
                userManager.updateUIForLoggedOutUser();
            }
        }

        function updateLogoOnPage() {
            const savedLogo = localStorage.getItem('siteLogo');
            const savedName = localStorage.getItem('siteName');
            
            if (savedLogo) {
                const logoIcon = document.querySelector('.logo i');
                if (logoIcon) {
                    const img = document.createElement('img');
                    img.src = savedLogo;
                    img.style.width = '40px';
                    img.style.height = '40px';
                    img.style.objectFit = 'contain';
                    img.style.marginRight = '0.5rem';
                    logoIcon.parentNode.replaceChild(img, logoIcon);
                }
            }
            
            if (savedName) {
                const nameElement = document.querySelector('.logo span');
                if (nameElement) nameElement.textContent = savedName;
            }
        }

        function submitContactForm(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            
            const contactData = {
                id: Date.now(),
                name: formData.get('name'),
                email: formData.get('email'),
                subject: formData.get('subject'),
                message: formData.get('message'),
                date: new Date().toISOString(),
                status: 'new'
            };
            
            // Store contact message
            const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            contacts.push(contactData);
            localStorage.setItem('contacts', JSON.stringify(contacts));
            
            // Show success message
            alert('Thank you for your message! We will get back to you soon.');
            event.target.reset();
        }

        function updateContactInfoOnPage() {
            const contactEmail = localStorage.getItem('contactEmail') || 'info@touristguide.com';
            const supportEmail = localStorage.getItem('supportEmail') || 'support@touristguide.com';
            const contactPhone = localStorage.getItem('contactPhone') || '+91 9876543210';
            const contactAddress = localStorage.getItem('contactAddress') || 'New Delhi, India';

            const emailEl = document.getElementById('contact-email-display');
            const phoneEl = document.getElementById('contact-phone-display');
            const addressEl = document.getElementById('contact-address-display');

            if (emailEl) emailEl.textContent = contactEmail || supportEmail;
            if (phoneEl) phoneEl.textContent = contactPhone;
            if (addressEl) addressEl.textContent = contactAddress;
        }

        window.addEventListener('storage', function(event) {
            if (!event.key || ['contactEmail', 'supportEmail', 'contactPhone', 'contactAddress'].includes(event.key)) {
                updateContactInfoOnPage();
            }
        });

        window.addEventListener('settingsUpdated', updateContactInfoOnPage);
        window.addEventListener('remoteStatePulled', updateContactInfoOnPage);
    </script>

    <style>
        @media (max-width: 768px) {
            section > div > div {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }
        }
    </style>
</body>
</html>
